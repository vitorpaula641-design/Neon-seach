<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEON // Início</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07080f; --card:rgba(14,16,32,.82); --line:rgba(120,130,255,.22);
  --text:#f2f4ff; --muted:#a5a9c7; --cyan:#19e3ff; --grad:linear-gradient(135deg,#8b5cf6,#3b82f6);
  --overlay:rgba(5,6,14,.55);
}
:root[data-tema="claro"]{
  --bg:#eef0fb; --card:rgba(255,255,255,.88); --line:rgba(80,90,200,.25);
  --text:#14172b; --muted:#555a7a; --cyan:#0a8ea3; --overlay:rgba(238,240,251,.55);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  font-family:Inter,system-ui,sans-serif;color:var(--text);background:var(--bg);
  background-size:cover;background-position:center;background-attachment:fixed;
  min-height:100vh;
}
body::before{content:"";position:fixed;inset:0;background:var(--overlay);z-index:0}
main{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:28px 18px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;position:relative}
.logo{font-weight:800;letter-spacing:.22em;color:var(--cyan);text-shadow:0 0 14px var(--cyan);font-size:1.05rem}
.logo::before{content:"◆ ";font-size:.8em}
.btn-menu{
  width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--card);
  color:var(--text);font-size:1.5rem;cursor:pointer;display:grid;place-items:center;line-height:1
}
.menu{
  position:absolute;right:0;top:52px;min-width:210px;background:var(--card);backdrop-filter:blur(14px);
  border:1px solid var(--line);border-radius:16px;padding:6px;display:none;z-index:10;
  box-shadow:0 12px 40px rgba(0,0,0,.45)
}
.menu.aberto{display:block}
.menu button{
  width:100%;text-align:left;padding:13px 14px;background:none;border:0;color:var(--text);
  font:inherit;font-size:.95rem;border-radius:10px;cursor:pointer
}
.menu button:hover,.menu button:focus-visible{background:rgba(120,130,255,.16);outline:none}
.hora{text-align:center;margin-top:64px;font-size:5rem;font-weight:800;letter-spacing:-.03em;line-height:1}
.data{text-align:center;color:var(--muted);margin-top:10px;font-size:1.15rem}
.busca{
  display:flex;gap:8px;margin-top:38px;padding:8px;background:var(--card);
  border:1px solid var(--line);border-radius:22px
}
.busca input{flex:1;min-width:0;background:none;border:0;color:var(--text);font:inherit;padding:0 12px;font-size:1rem;outline:none}
.busca button{
  border:0;border-radius:16px;padding:14px 18px;background:var(--grad);color:#fff;
  font:inherit;font-weight:700;cursor:pointer
}
.cotacoes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.cot{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px}
.cot small{display:block;color:var(--muted);font-size:.78rem;letter-spacing:.08em}
.cot strong{display:block;font-size:1.45rem;margin:8px 0 4px}
.cot span{color:var(--muted);font-size:.88rem}
.sobe{color:#34d399!important}.desce{color:#f87171!important}
h2{
  text-align:center;color:var(--muted);font-weight:500;font-size:.85rem;letter-spacing:.3em;margin:30px 0 14px
}
.atalhos{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:12px}
.atalho{
  position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  padding:16px 8px;background:var(--card);border:1px solid var(--line);border-radius:18px;
  color:var(--text);text-decoration:none;font-size:.9rem;min-height:98px;text-align:center;word-break:break-word
}
.atalho img{width:36px;height:36px;border-radius:9px}
.atalho .letra{width:36px;height:36px;border-radius:9px;background:var(--grad);display:grid;place-items:center;font-weight:800;color:#fff}
.atalho .x{
  position:absolute;top:4px;right:6px;border:0;background:none;color:#f472b6;font-size:1rem;cursor:pointer;padding:4px
}
.vazio{grid-column:1/-1;text-align:center;color:var(--muted);font-size:.92rem;padding:8px 0}
.add{
  display:block;margin:18px auto 0;padding:14px 22px;background:var(--card);border:1px solid var(--line);
  border-radius:16px;color:var(--text);font:inherit;cursor:pointer
}
.rodape{text-align:center;color:var(--muted);font-size:.78rem;letter-spacing:.25em;margin-top:44px}
dialog{
  margin:auto;border:1px solid var(--line);border-radius:22px;background:var(--bg);color:var(--text);
  padding:22px;width:min(92vw,380px)
}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog h3{margin-bottom:14px}
dialog label{display:block;font-size:.85rem;color:var(--muted);margin:10px 0 6px}
dialog input{
  width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--card);
  color:var(--text);font:inherit;font-size:1rem
}
.acoes{display:flex;gap:10px;margin-top:18px}
.acoes button{flex:1;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;cursor:pointer}
.acoes .ok{background:var(--grad);border:0;color:#fff;font-weight:700}
.erro{color:#f87171;font-size:.85rem;margin-top:8px;min-height:1em}
@media (max-width:380px){.hora{font-size:4rem}}
</style>
</head>
<body>
<main>
  <header>
    <div class="logo">NEON / START</div>
    <button class="btn-menu" id="btnMenu" aria-label="Mais opções" aria-expanded="false">⋮</button>
    <div class="menu" id="menu" role="menu">
      <button id="optPapel" role="menuitem">Escolher papel de parede</button>
      <button id="optRemoverPapel" role="menuitem">Remover papel de parede</button>
      <button id="optTema" role="menuitem">Modo claro</button>
    </div>
    <input type="file" id="arquivo" accept="image/*" hidden>
  </header>

  <div class="hora" id="hora">--:--</div>
  <div class="data" id="data"></div>

  <form class="busca" id="formBusca">
    <input id="q" type="text" placeholder="Pesquisar na internet..." autocomplete="off">
    <button type="submit">PESQUISAR</button>
  </form>

  <section class="cotacoes">
    <div class="cot">
      <small>₿ BITCOIN / BRL</small>
      <strong id="btcValor">Carregando…</strong>
      <span id="btcVar"></span>
    </div>
    <div class="cot">
      <small>US$ 1 EM REAIS</small>
      <strong id="usdValor">Carregando…</strong>
      <span id="usdInfo">Dólar comercial de referência</span>
    </div>
  </section>

  <h2>ACESSO RÁPIDO</h2>
  <section class="atalhos" id="atalhos"></section>
  <button class="add" id="btnAdd">+ Adicionar atalho</button>

  <p class="rodape">YOUR SPACE · YOUR RULES</p>
</main>

<dialog id="dlg">
  <form method="dialog" id="formAtalho">
    <h3>Novo atalho</h3>
    <label for="nome">Nome</label>
    <input id="nome" type="text" placeholder="Ex.: Meu site" maxlength="30">
    <label for="url">Endereço do site</label>
    <input id="url" type="text" placeholder="exemplo.com" inputmode="url" autocapitalize="off">
    <div class="erro" id="erro"></div>
    <div class="acoes">
      <button type="button" id="cancelar">Cancelar</button>
      <button type="submit" class="ok">Salvar</button>
    </div>
  </form>
</dialog>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const K = {tema:"neon.tema", papel:"neon.papel", atalhos:"neon.atalhos.v2", usd:"neon.usd", btc:"neon.btc"};
  const guardar = (k,v) => { try{ localStorage.setItem(k, v); return true; }catch(e){ return false; } };
  const ler = k => { try{ return localStorage.getItem(k); }catch(e){ return null; } };
  const apagar = k => { try{ localStorage.removeItem(k); }catch(e){} };

  /* Relógio */
  function relogio(){
    const d = new Date();
    $("hora").textContent = d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
    let s = d.toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
    $("data").textContent = s.replace(/(^|\s)(\p{L})/gu,(m,a,b)=>a+b.toUpperCase());
  }
  relogio(); setInterval(relogio, 15000);

  /* Busca */
  $("formBusca").addEventListener("submit", e=>{
    e.preventDefault();
    const q = $("q").value.trim();
    if(q) location.href = "https://www.google.com/search?q=" + encodeURIComponent(q);
  });

  /* Menu de três pontos */
  const menu = $("menu"), btnMenu = $("btnMenu");
  function menuToggle(abrir){
    menu.classList.toggle("aberto", abrir);
    btnMenu.setAttribute("aria-expanded", abrir);
  }
  btnMenu.addEventListener("click", e=>{ e.stopPropagation(); menuToggle(!menu.classList.contains("aberto")); });
  document.addEventListener("click", e=>{ if(!menu.contains(e.target)) menuToggle(false); });
  document.addEventListener("keydown", e=>{ if(e.key==="Escape") menuToggle(false); });

  /* Tema */
  function aplicarTema(t){
    if(t==="claro") document.documentElement.setAttribute("data-tema","claro");
    else document.documentElement.removeAttribute("data-tema");
    $("optTema").textContent = t==="claro" ? "Modo escuro" : "Modo claro";
  }
  aplicarTema(ler(K.tema)||"escuro");
  $("optTema").addEventListener("click", ()=>{
    const novo = document.documentElement.getAttribute("data-tema")==="claro" ? "escuro" : "claro";
    aplicarTema(novo); guardar(K.tema, novo); menuToggle(false);
  });

  /* Papel de parede */
  function aplicarPapel(url){
    document.body.style.backgroundImage = url ? "url("+url+")" : "none";
  }
  aplicarPapel(ler(K.papel));
  $("optPapel").addEventListener("click", ()=>{ menuToggle(false); $("arquivo").click(); });
  $("optRemoverPapel").addEventListener("click", ()=>{ apagar(K.papel); aplicarPapel(null); menuToggle(false); });
  $("arquivo").addEventListener("change", e=>{
    const f = e.target.files[0]; if(!f) return;
    const img = new Image(), url = URL.createObjectURL(f);
    img.onload = ()=>{
      const max = 1400, esc = Math.min(1, max/Math.max(img.width,img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width*esc); c.height = Math.round(img.height*esc);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      const data = c.toDataURL("image/jpeg",0.75);
      URL.revokeObjectURL(url);
      aplicarPapel(data);
      if(!guardar(K.papel, data)) alert("A imagem é grande demais para ficar salva. Ela aparece agora, mas some ao atualizar. Tente uma imagem menor.");
    };
    img.src = url; e.target.value = "";
  });

  /* Cotações */
  const real = n => n.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
  async function json(url){
    const r = await fetch(url,{cache:"no-store"});
    if(!r.ok) throw new Error(r.status);
    return r.json();
  }

  function mostrarUSD(v, hora){
    $("usdValor").textContent = real(v);
    $("usdInfo").textContent = "Dólar comercial · " + (hora||"");
  }
  async function dolar(){
    const fontes = [
      async()=> Number((await json("https://economia.awesomeapi.com.br/last/USD-BRL")).USDBRL.bid),
      async()=> (await json("https://open.er-api.com/v6/latest/USD")).rates.BRL,
      async()=> (await json("https://api.frankfurter.app/latest?from=USD&to=BRL")).rates.BRL,
      async()=> (await json("https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.json")).usd.brl
    ];
    for(const f of fontes){
      try{
        const v = await f();
        if(v && isFinite(v)){
          const hora = new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
          guardar(K.usd, JSON.stringify({v,hora}));
          mostrarUSD(v,hora); return;
        }
      }catch(e){}
    }
    const salvo = ler(K.usd);
    if(salvo){ try{ const o = JSON.parse(salvo); mostrarUSD(o.v, o.hora+" (último valor salvo)"); return; }catch(e){} }
    $("usdValor").textContent = "Indisponível";
    $("usdInfo").textContent = "Sem conexão com as fontes de cotação";
  }

  function mostrarBTC(v, pct){
    $("btcValor").textContent = real(v);
    const el = $("btcVar");
    if(typeof pct === "number"){
      el.textContent = "Variação 24h: " + pct.toFixed(2).replace(".",",") + "%";
      el.className = pct>=0 ? "sobe" : "desce";
    } else { el.textContent = ""; el.className = ""; }
  }
  async function bitcoin(){
    const fontes = [
      async()=>{ const d=(await json("https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=brl&include_24hr_change=true")).bitcoin; return [d.brl, d.brl_24h_change]; },
      async()=>{ const d=(await json("https://economia.awesomeapi.com.br/last/BTC-BRL")).BTCBRL; return [Number(d.bid), Number(d.pctChange)]; }
    ];
    for(const f of fontes){
      try{
        const [v,p] = await f();
        if(v){ guardar(K.btc, JSON.stringify({v,p})); mostrarBTC(v,p); return; }
      }catch(e){}
    }
    const salvo = ler(K.btc);
    if(salvo){ try{ const o=JSON.parse(salvo); mostrarBTC(o.v,o.p); return; }catch(e){} }
    $("btcValor").textContent = "Indisponível";
  }
  dolar(); bitcoin();
  setInterval(dolar, 5*60*60*1000);   // dólar: a cada 5 horas
  setInterval(bitcoin, 5*60*1000);    // bitcoin: a cada 5 minutos

  /* Atalhos (somente os que você adicionar) */
  function carregar(){
    try{ const a = JSON.parse(ler(K.atalhos)||"[]"); return Array.isArray(a) ? a : []; }catch(e){ return []; }
  }
  let lista = carregar();
  const salvar = ()=> guardar(K.atalhos, JSON.stringify(lista));

  function desenhar(){
    const box = $("atalhos"); box.innerHTML = "";
    if(!lista.length){
      const p = document.createElement("p"); p.className="vazio";
      p.textContent = "Nenhum atalho ainda. Toque em “Adicionar atalho”.";
      box.appendChild(p); return;
    }
    lista.forEach((s,i)=>{
      const a = document.createElement("a");
      a.className = "atalho"; a.href = s.url; a.rel = "noopener";
      let host = ""; try{ host = new URL(s.url).hostname; }catch(e){}
      const ico = document.createElement("img");
      ico.alt = ""; ico.src = "https://www.google.com/s2/favicons?sz=64&domain=" + encodeURIComponent(host);
      ico.onerror = ()=>{
        const l = document.createElement("div"); l.className="letra";
        l.textContent = (s.nome||host||"?").charAt(0).toUpperCase(); ico.replaceWith(l);
      };
      const nome = document.createElement("span"); nome.textContent = s.nome;
      const x = document.createElement("button");
      x.className = "x"; x.type="button"; x.setAttribute("aria-label","Remover "+s.nome); x.textContent = "✕";
      x.addEventListener("click", ev=>{
        ev.preventDefault(); ev.stopPropagation();
        lista.splice(i,1); salvar(); desenhar();
      });
      a.append(ico, nome, x);
      box.appendChild(a);
    });
  }
  desenhar();

  const dlg = $("dlg");
  $("btnAdd").addEventListener("click", ()=>{
    $("nome").value=""; $("url").value=""; $("erro").textContent="";
    dlg.showModal(); $("nome").focus();
  });
  $("cancelar").addEventListener("click", ()=> dlg.close());
  $("formAtalho").addEventListener("submit", e=>{
    e.preventDefault();
    let url = $("url").value.trim(), nome = $("nome").value.trim();
    if(!url){ $("erro").textContent = "Digite o endereço do site."; return; }
    if(!/^https?:\/\//i.test(url)) url = "https://" + url;
    let u; try{ u = new URL(url); if(!u.hostname.includes(".")) throw 0; }catch(x){ $("erro").textContent = "Endereço inválido. Exemplo: exemplo.com"; return; }
    if(!nome) nome = u.hostname.replace(/^www\./,"");
    lista.push({nome, url:u.href});
    if(!salvar()) alert("Não foi possível salvar. Verifique se o navegador permite armazenamento do site.");
    desenhar(); dlg.close();
  });
})();
</script>
</body>
</html>
