<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090b12">
<title>NEON // Início</title>
<style>
:root{--accent:#00f0ff;--accent2:#a855f7;--text:#f4f7ff;--muted:#9aa5bd;--panel:rgba(13,17,31,.72);--line:rgba(255,255,255,.11)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,system-ui,Arial,sans-serif;color:var(--text);background:#080a12 center/cover fixed no-repeat;display:flex;justify-content:center;align-items:center;padding:28px;position:relative}
body:before{content:"";position:fixed;inset:0;background:linear-gradient(120deg,rgba(3,6,15,.82),rgba(7,10,20,.55));z-index:-1}
.app{width:min(900px,100%);text-align:center}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:58px}.brand{font-size:13px;letter-spacing:5px;font-weight:900;color:var(--accent);text-shadow:0 0 18px var(--accent)}.actions{display:flex;gap:9px}
button,.file-label{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:10px 13px;border-radius:12px;cursor:pointer;font-size:13px;backdrop-filter:blur(14px)}button:hover,.file-label:hover{border-color:var(--accent);box-shadow:0 0 16px #00f0ff30}
.clock{font-size:clamp(54px,12vw,92px);font-weight:800;letter-spacing:-5px;text-shadow:0 0 30px #00d9ff35}.date{color:var(--muted);margin:0 0 34px;text-transform:capitalize}
.search{width:min(680px,100%);margin:auto;display:flex;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:7px;backdrop-filter:blur(18px);box-shadow:0 12px 50px #0005}.search input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--text);font-size:16px;padding:13px 15px}.search button{background:linear-gradient(120deg,var(--accent2),#2563eb);border:0;font-weight:800;padding:0 22px}
.market{display:flex;gap:14px;justify-content:center;margin:20px auto 38px;flex-wrap:wrap}.card{min-width:210px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:15px 18px;backdrop-filter:blur(16px)}.label{font-size:11px;letter-spacing:1.8px;color:var(--muted);text-transform:uppercase}.value{font-size:21px;font-weight:750;margin-top:6px}.sub{font-size:11px;color:var(--muted);margin-top:3px}
.section-title{font-size:11px;letter-spacing:3px;color:var(--muted);margin-bottom:15px}.shortcuts{display:flex;gap:13px;justify-content:center;flex-wrap:wrap}.shortcut{width:86px;position:relative;text-decoration:none;color:var(--text);padding:13px 8px;border-radius:15px;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(14px)}.shortcut .icon{font-size:25px;display:block;margin-bottom:8px}.shortcut span:last-child{font-size:11px}.shortcut:hover{transform:translateY(-3px);border-color:var(--accent)}.remove{position:absolute;right:4px;top:2px;border:0;background:transparent;padding:2px 5px;color:#ff7b91;font-size:15px}
.add{margin-top:17px}.footer{margin-top:48px;color:#778198;font-size:10px;letter-spacing:2px}
input[type=file]{display:none}.light{--text:#111827;--muted:#4b5563;--panel:rgba(255,255,255,.72);--line:rgba(0,0,0,.12)}.light:before{background:linear-gradient(120deg,rgba(245,248,255,.58),rgba(245,248,255,.34))}
@media(max-width:560px){body{padding:17px}.top{margin-bottom:46px}.brand{letter-spacing:3px}.actions button,.file-label{padding:9px;font-size:11px}.clock{letter-spacing:-3px}.card{min-width:145px;flex:1}.value{font-size:18px}.shortcut{width:76px}}
</style>
</head>
<body>
<main class="app">
 <header class="top"><div class="brand">◆ NEON / START</div><div class="actions">
  <label class="file-label" for="wallpaper">＋ PAPEL DE PAREDE</label><input id="wallpaper" type="file" accept="image/*">
  <button id="theme">☀ MODO CLARO</button>
 </div></header>
 <div class="clock" id="clock">00:00</div><p class="date" id="date"></p>
 <form class="search" action="https://www.google.com/search" method="get"><input name="q" autocomplete="off" placeholder="Pesquisar na internet..." aria-label="Pesquisar"><button type="submit">PESQUISAR ↗</button></form>
 <section class="market">
  <div class="card"><div class="label">₿ Bitcoin / BRL</div><div class="value" id="btc">Carregando...</div><div class="sub" id="btc-sub">Cotação em reais</div></div>
  <div class="card"><div class="label">US$ 1 em reais</div><div class="value" id="usd">Carregando...</div><div class="sub">Dólar comercial de referência</div></div>
 </section>
 <div class="section-title">◆ ACESSO RÁPIDO ◆</div><nav class="shortcuts" id="shortcuts"></nav>
 <button class="add" id="add">＋ ADICIONAR ATALHO</button>
 <div class="footer">YOUR SPACE · YOUR RULES</div>
</main>
<script>
const $=id=>document.getElementById(id);
function tick(){const d=new Date();$('clock').textContent=d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});$('date').textContent=d.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});}
tick();setInterval(tick,1000);
const defaults=[['YouTube','https://youtube.com','▶️'],['TikTok','https://tiktok.com','♪'],['Instagram','https://instagram.com','📸'],['Discord','https://discord.com/app','🎮'],['Spotify','https://open.spotify.com','🎧']];
let links=JSON.parse(localStorage.getItem('neon-links')||'null')||defaults;
function render(){ $('shortcuts').innerHTML='';links.forEach((x,i)=>{const a=document.createElement('a');a.className='shortcut';a.href=x[1];a.target='_blank';a.rel='noopener';a.innerHTML=`<button class="remove" title="Remover">×</button><span class="icon">${x[2]||'🌐'}</span><span></span>`;a.querySelector('span:last-child').textContent=x[0];a.querySelector('button').onclick=e=>{e.preventDefault();e.stopPropagation();links.splice(i,1);save();};$('shortcuts').append(a);});}
function save(){localStorage.setItem('neon-links',JSON.stringify(links));render();}
$('add').onclick=()=>{const name=prompt('Nome do site:');if(!name)return;let url=prompt('Endereço do site (ex.: https://exemplo.com):');if(!url)return;if(!/^https?:\/\//i.test(url))url='https://'+url;links.push([name,url,'🌐']);save();};
render();
$('theme').onclick=()=>{document.body.classList.toggle('light');const light=document.body.classList.contains('light');localStorage.setItem('neon-light',light?'1':'0');$('theme').textContent=light?'☾ MODO ESCURO':'☀ MODO CLARO';};
if(localStorage.getItem('neon-light')==='1'){$('theme').click();}
$('wallpaper').onchange=e=>{const f=e.target.files[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{document.body.style.backgroundImage=`url("${reader.result}")`;try{localStorage.setItem('neon-wallpaper',reader.result)}catch(err){alert('Imagem muito grande para salvar. Tente uma imagem menor.')}};reader.readAsDataURL(f);};
const saved=localStorage.getItem('neon-wallpaper');if(saved)document.body.style.backgroundImage=`url("${saved}")`;
const money=n=>Number(n).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
async function quotes(){
 try{const r=await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=brl&include_24hr_change=true');if(!r.ok)throw Error();const j=await r.json();$('btc').textContent=money(j.bitcoin.brl);$('btc-sub').textContent=`Variação 24h: ${j.bitcoin.brl_24h_change.toFixed(2).replace('.',',')}%`;}
 catch(e){$('btc').textContent='Indisponível';$('btc-sub').textContent='Toque para tentar mais tarde';}
 try{const r=await fetch('https://api.frankfurter.app/latest?from=USD&to=BRL');if(!r.ok)throw Error();const j=await r.json();$('usd').textContent=money(j.rates.BRL);}
 catch(e){$('usd').textContent='Indisponível';}
}
quotes();setInterval(quotes,300000);
</script>
</body></html>
